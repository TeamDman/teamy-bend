[package]
name = "teamy-bend-sys"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Synchronous native socket provider for generated Bend JavaScript"
repository = "https://github.com/TeamDman/teamy-bend"
publish = false

[lib]
name = "teamy_bend_sys"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.12.7", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3.6.8"
socket2 = "0.6.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
napi-build = "2.4.4"
